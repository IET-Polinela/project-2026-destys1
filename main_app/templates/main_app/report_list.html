<!DOCTYPE html>
<html>
<head>
    <title>Daftar Laporan</title>
</head>
<body>
    <h2>Daftar Laporan</h2>

    <a href="{% url 'add_report' %}">Tambah Laporan</a>

    <ul>
        {% for report in reports %}
            <li>
                <b>{{ report.title }}</b> - {{ report.category }} <br>
                {{ report.description }} <br>
                {{ report.location }} <br>

                <b>Status:</b> {{ report.status }} <br>

                <a href="{% url 'update_report' report.id %}">Edit</a> |
                <a href="{% url 'delete_report' report.id %}">Hapus</a>
            </li>
            <hr>
        {% endfor %}
    </ul>
</body>
</html>
