{% extends 'base.html' %}

{% block title %}Hapus Laporan{% endblock %}

{% block content %}

<nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb bg-white px-3 py-2 rounded shadow-sm">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item"><a href="{% url 'report_list' %}">Reports</a></li>
        <li class="breadcrumb-item active" aria-current="page">Hapus Laporan</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="page-card text-center">
            <h3 class="mb-3 text-danger">⚠️ Konfirmasi Hapus</h3>
            <p>Apakah kamu yakin ingin menghapus laporan <strong>{{ object.title }}</strong>?</p>
            <p class="text-muted">Tindakan ini tidak dapat dibatalkan.</p>

            <form method="post" onsubmit="return confirm('Yakin ingin menghapus laporan ini?');">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Hapus</button>
                <a href="{% url 'report_list' %}" class="btn btn-secondary">Batal</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
