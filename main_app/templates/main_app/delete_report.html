<!DOCTYPE html>
<html>
<head>
    <title>Hapus Laporan</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
            text-align: center;
        }

        .container{
            margin-top: 100px;
        }

        .card{
            background: #1f2a40;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
        }

        button{
            background: #ff4c4c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover{
            background: #cc0000;
        }

        a{
            text-decoration: none;
            color: white;
            background: #00adb5;
            padding: 10px 20px;
            border-radius: 5px;
        }

        a:hover{
            background: #008891;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">
        <h2> Hapus Laporan</h2>

        <p>Apakah kamu yakin ingin menghapus:</p>
        <h3>"{{ object.title }}"</h3>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">🗑 Ya, Hapus</button>
        </form>

        <br><br>

        <a href="{% url 'report_list' %}">⬅ Batal</a>
    </div>

</div>

</body>
</html>
