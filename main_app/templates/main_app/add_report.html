<!DOCTYPE html>
<html>
<head>
    <title>Tambah Laporan</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
            text-align: center;
        }

        .container{
            margin-top: 80px;
        }

        .card{
            background: #1f2a40;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            text-align: left;
            width: 50%;
        }

        h2{
            text-align: center;
        }

        input, textarea, select{
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: none;
        }

        button{
            background: #00adb5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: #008891;
        }

        a{
            text-decoration: none;
            color: white;
            background: #00adb5;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 15px;
        }

        a:hover{
            background: #008891;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">
        <h2>➕ Tambah Laporan</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Simpan</button>
        </form>

        <a href="{% url 'report_list' %}">⬅ Kembali</a>
    </div>

</div>

</body>
</html>
