<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart City Portal</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>

        body {

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            min-height: 100vh;

            font-family:
                'Segoe UI',
                sans-serif;
        }

        .glass-card {

            background:
                rgba(255,255,255,0.9);

            backdrop-filter:
                blur(10px);

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.08);

            transition: 0.3s;
        }

        .glass-card:hover {

            transform:
                translateY(-5px);
        }

        .navbar {

            background:
                linear-gradient(
                    90deg,
                    #0f172a,
                    #1e293b
                );
        }

        .brand-logo {

            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }

        .dashboard-title {

            font-size: 2rem;
            font-weight: 700;
        }

        .menu-icon {

            font-size: 2rem;
            color: #2563eb;
        }

        .welcome-box {

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: white;
        }

    </style>

</head>

<body>

    <nav class="navbar navbar-dark shadow-sm">

        <div class="container-fluid px-4 py-2">

            <a class="navbar-brand fw-bold brand-logo"
               href="#">

                <i class="bi bi-buildings-fill me-2"></i>

                Smart City Portal

            </a>

            <div id="nav-menu"></div>

        </div>

    </nav>

    <main class="container-fluid px-4 mt-4"
          id="app-content"></main>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/app.js"></script>

    <script src="js/router.js"></script>

</body>

</html>
