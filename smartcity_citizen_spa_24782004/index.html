<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart City Portal</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>

        body {

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            min-height: 100vh;

            font-family:
                'Segoe UI',
                sans-serif;
        }

        .glass-card {

            background:
                rgba(255,255,255,0.9);

            backdrop-filter:
                blur(10px);

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.08);

            transition: 0.3s;
        }

        .glass-card:hover {

            transform:
                translateY(-5px);
        }

        .navbar {

            background:
                linear-gradient(
                    90deg,
                    #0f172a,
                    #1e293b
                );
        }

        .brand-logo {

            font-size: 1.3rem;

            letter-spacing: 0.5px;
        }

        .dashboard-title {

            font-size: 2rem;

            font-weight: 700;
        }

        .menu-icon {

            font-size: 2rem;

            color: #2563eb;
        }

        .welcome-box {

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: white;
        }

.report-card {

    max-width: 1000px;

    margin: 0 auto;

    background:
    #fafafa;

    border-radius:
        20px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);
}

.report-card:hover {

    transform:
        translateY(-5px);

    box-shadow:
        0 10px 25px
        rgba(0,0,0,0.12);
}

.status-badge {

    font-size: 0.8rem;

    padding: 6px 12px;

    border-radius: 50px;
}

.progress {

    height: 28px;

    border-radius: 50px;

    background: #e5e7eb;
}

.progress-bar {

    font-weight: 600;
}

.status-draft {

    background: #6c757d;
}

.status-reported {

    background: #ffc107;

    color: black;
}

.status-verified {

    background: #20c997;
}

.modal-content {

    border: none;

    border-radius: 20px;

    overflow: hidden;
}

.modal-header {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #3b82f6
        );

    color: white;
}

.modal-title {

    font-weight: 700;
}

.form-control {

    border-radius: 10px;
}

.form-control:focus {

    box-shadow:
        0 0 0 0.25rem
        rgba(37,99,235,.2);
}

.nav-tabs {

    border-bottom: none;
}

.nav-tabs .nav-link {

    border: none;

    border-radius: 30px;

    padding: 10px 22px;

    font-size: 14px;

    margin-right: 10px;

    font-weight: 600;

    color: #2563eb;

    transition: all 0.3s ease;
}

.nav-tabs .nav-link:hover {

    background: #dbeafe;
}

.nav-tabs .nav-link.active {

    background: #2563eb;

    color: white;

    box-shadow:
        0 4px 12px
        rgba(37,99,235,.25);
}


    </style>

</head>

<body>

    <nav class="navbar navbar-dark shadow-sm">

        <div class="container-fluid px-4 py-2">

            <a class="navbar-brand fw-bold brand-logo"
               href="#dashboard">

                <i class="bi bi-buildings-fill me-2"></i>

                Velora City Portal

            </a>

            <div id="nav-menu"></div>

        </div>

    </nav>

    <main
        class="container-fluid px-4 mt-4"
        id="app-content">
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/app.js"></script>

    <script src="js/router.js"></script>

</body>

</html>
